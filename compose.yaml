# RAGGuard local deployment (Stage 6, D-075). Start:   docker compose up -d --build
#                                          Stop:    docker compose down      (never `down -v`)
# Full guide: deployment/README.md
#
#   browser ──▶ frontend (Nginx, 127.0.0.1:${WEB_PORT}) ──▶ backend (FastAPI) ──▶ qdrant (vector store)
#                                                              └──▶ Ollama on the HOST (host.docker.internal)
#
# Ollama is deliberately NOT a service here: the host's Ollama already holds the model (7+ GB)
# and uses the Mac's GPU, which a Linux container on Docker Desktop cannot.
#
# Variables are read from the shell or from the repository's `.env`. Deploy-time settings are
# listed under `environment:` and nowhere else; `.env` is NOT passed to the backend wholesale,
# so host-only values (OLLAMA_BASE_URL=http://localhost:11434, QDRANT_LOCAL_PATH, ...) cannot
# leak into the container.

name: ragguard

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged # server minor = pinned qdrant-client 1.19.x
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    # No `ports:`: only the backend (same Compose network) reaches Qdrant.
    healthcheck:
      # The image ships no curl/wget; bash's /dev/tcp sends a minimal HTTP request instead.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      target: runtime
    image: ragguard-backend:local
    restart: unless-stopped
    init: true
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same-origin deployment: the browser never calls the API from another origin, so CORS
      # is not exercised; the web origin is listed for completeness.
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
      # --- generation: local Ollama on the host by default; Gemini only if you choose it ---
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # --- embeddings: downloaded once into the hf_cache volume ---
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # --- vector store: the qdrant service (server mode); QDRANT_LOCAL_PATH is not used ---
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-ragguard_chunks} # new name if EMBEDDING_MODEL changes
      # Chunking, retrieval threshold, prompt: image defaults = the accepted Stage 5.7 baseline.
      # Data locations (HF_HOME, MLFLOW_*, EVALUATION_RESULTS_DIR) are set by the image.
    extra_hosts:
      - host.docker.internal:host-gateway # already defined on Docker Desktop; needed on Linux
    volumes:
      - hf_cache:/data/hf-cache
      - mlflow:/data/mlflow
      - reports:/data/reports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
      target: runtime
    image: ragguard-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only by default; WEB_BIND=0.0.0.0 would expose the app to the whole network.
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Named volumes survive `docker compose down` and container recreation. They are removed
# only by `docker compose down -v` / `docker volume rm`, which this project never runs.
volumes:
  qdrant_storage: # the vector index: documents and chunks uploaded in the Docker deployment
  hf_cache: # embedding-model files (downloaded on first use)
  mlflow: # tracking database (mlflow.db) and artifacts, one volume so their paths stay valid
  reports: # evaluation reports written by the evaluation CLI, read by the API
