# RAGGuard web server (Stage 6, D-075). Replaces conf.d/default.conf of
# nginxinc/nginx-unprivileged, so it listens on 8080 as an unprivileged user.
#
#   /                      the production frontend build (hash-based routing: URLs never need rewriting)
#   /health /ingest ...    the API, proxied to the `backend` service of compose.yaml
#
# The browser only ever talks to this origin: no CORS, and no API URL in the JavaScript bundle.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The backend enforces MAX_UPLOAD_SIZE_MB (at most 100); this only has to be larger.
    client_max_body_size 105m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers. No location below defines add_header, so these apply everywhere.
    # style-src 'unsafe-inline': React sets inline style attributes; scripts stay 'self' only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Liveness of this container (used by the image HEALTHCHECK); does not touch the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API: exactly the route prefixes the frontend calls (no /docs, no /diagnostics).
    location ~ ^/(health|ingest|documents|query|evaluations|experiments|system)(/|$) {
        # Docker's embedded DNS, asked on every request (valid=10s): the backend can be
        # restarted or recreated with a new IP without restarting this container, and this
        # container can start before the backend exists.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Longer than the frontend's own limits (query 200 s, upload 300 s).
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;

        # Errors made by Nginx itself (the backend is down or too slow) use the API's own
        # error shape, which the frontend already shows. Backend-made errors pass through.
        error_page 502 503 = @api_unavailable;
        error_page 504 = @api_timeout;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":{"code":"backend_unavailable","message":"The web server cannot reach the RAGGuard API. Check that the backend container is running and healthy (docker compose ps)."}}';
    }

    location @api_timeout {
        default_type application/json;
        return 504 '{"error":{"code":"backend_timeout","message":"The RAGGuard API did not answer in time."}}';
    }

    # Hashed build output: a missing asset is a real 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
